#!/usr/sbin/nft -f
# =============================================================================
#  Pare-feu pi-server — politique : tout refuser en entrée, sauf ce qui est listé.
#  Réseau local     : /etc/nftables.d/00-lan.nft
#  Règles par rôle  : /etc/nftables.d/10-*.nft (données), 20-*.nft (son)…
#  Vérifier         : sudo nft -c -f /etc/nftables.conf
#  Appliquer        : sudo systemctl restart nftables
# =============================================================================
flush ruleset

include "/etc/nftables.d/00-lan.nft"

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif "lo" accept

        # ICMP / ICMPv6 (ping, découverte de voisins IPv6, PMTU…)
        meta l4proto { icmp, ipv6-icmp } accept
        # Client DHCPv6
        ip6 saddr fe80::/10 udp dport 546 accept

        # SSH et mDNS (nom-de-la-pi.local) uniquement depuis le réseau local
        ip  saddr $LAN4 tcp dport 22 accept
        ip6 saddr $LAN6 tcp dport 22 accept
        ip  saddr $LAN4 udp dport 5353 accept
        ip6 saddr $LAN6 udp dport 5353 accept
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
    }
    chain output {
        type filter hook output priority filter; policy accept;
    }
}

# Règles ajoutées par le serveur de données / le serveur de son
include "/etc/nftables.d/[1-9]*.nft"
